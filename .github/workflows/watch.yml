name: Seat watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test WhatsApp message instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check seats
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python watcher.py
      - name: Save state
        run: |
          git config user.name "seat-watcher"
          git config user.email "seat-watcher@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Update seat state" && git push)
