name: Seat watcher

# Main trigger: cron-job.org calls the "run workflow" API every 15 minutes
# (see README). GitHub's own schedule below is only a slow backup, since
# GitHub often delays scheduled runs by hours on small repos.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test WhatsApp message instead of checking"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: seat-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check seats
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python watcher.py
      - name: Save state
        if: always()
        run: |
          git config user.name "seat-watcher"
          git config user.email "seat-watcher@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seat state"
          git pull --rebase -X theirs || true
          git push
